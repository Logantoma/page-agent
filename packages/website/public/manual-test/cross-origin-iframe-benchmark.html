<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B4.6 跨域 iframe Benchmark</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#edf2f7;color:#172033}.wrap{max-width:900px;margin:32px auto;padding:0 20px}.card{background:#fff;border:1px solid #d8e0ea;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(20,30,50,.06)}iframe{width:100%;height:240px;border:2px solid #9fb1c8;border-radius:12px;background:#fff}.field{display:grid;gap:7px;margin-top:18px}.field input{height:44px;padding:0 12px;border:1px solid #aeb9c9;border-radius:9px;font-size:16px}button{margin-top:16px;height:44px;padding:0 18px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:750;cursor:pointer}.result{margin-top:14px;font-weight:850;font-size:18px}.pass{color:#16794b}.fail{color:#b42318}.diag{margin-top:10px;font-size:13px;line-height:1.7;color:#475467}.hint{padding:10px 12px;border-radius:10px;background:#fff8e8;border:1px solid #f0d58c;color:#7a5a00}</style></head><body><div class="wrap"><section class="card"><h1>B4.6 跨域 iframe 业务组件验证</h1><p>下面嵌入的是不同 Origin 的第三方业务组件。请在 iframe 内点击“显示第三方验证代码”，读取出现的代码，然后填写到主页面并提交。</p><div class="hint" id="originHint">正在构造不同 Origin 的 iframe…</div><iframe id="thirdPartyFrame" title="第三方验证组件"></iframe><label class="field" for="frameCode"><span>第三方验证代码</span><input id="frameCode" autocomplete="off" placeholder="从 iframe 内读取"></label><button id="submit" type="button">提交跨域 iframe 验证</button><div class="result" id="result">WAITING</div><div class="diag" id="diag"></div></section></div><script>(()=>{const host=location.hostname==='127.0.0.1'?'localhost':'127.0.0.1';const targetPath=location.pathname.replace('cross-origin-iframe-benchmark.html','cross-origin-iframe-target.html');const target=`${location.protocol}//${host}:${location.port}${targetPath}`;const frame=document.getElementById('thirdPartyFrame');const originHint=document.getElementById('originHint');const input=document.getElementById('frameCode');const result=document.getElementById('result');const diag=document.getElementById('diag');let ready=false,revealed=false;frame.src=target;originHint.textContent=`主页面 Origin: ${location.origin} · iframe Origin: ${new URL(target).origin}`;window.addEventListener('message',(e)=>{if(e.source!==frame.contentWindow)return;if(e.data?.type==='b46-frame-ready')ready=true;if(e.data?.type==='b46-frame-revealed')revealed=true;});document.getElementById('submit').addEventListener('click',()=>{const checks={crossOrigin:new URL(target).origin!==location.origin,frameReady:ready,frameInteracted:revealed,code:input.value.trim()==='FRM-642'};const ok=Object.values(checks).every(Boolean);result.textContent=ok?'PASS: cross-origin iframe interaction completed':'FAIL: cross-origin iframe checkpoint failed';result.className='result '+(ok?'pass':'fail');diag.textContent=Object.entries(checks).map(([k,v])=>`${k}:${v?'PASS':'FAIL'}`).join(' · ');});})();</script></body></html>
