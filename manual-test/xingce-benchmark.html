<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Page Agent 综合推理离线基准</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:920px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.top h1{margin:0 0 6px;font-size:24px}.top p{margin:0;color:#667085;font-size:13px}.progress{min-width:220px;color:#667085;font-size:13px;text-align:right}.bar{height:8px;background:#e8ecf3;border-radius:99px;overflow:hidden;margin-top:7px}.bar>div{height:100%;background:#3157d5;width:0}.card{background:#fff;border:1px solid #d9e0ea;border-radius:16px;padding:26px;box-shadow:0 8px 28px rgba(28,39,60,.06)}.meta{display:flex;gap:8px;align-items:center}.badge{font-size:12px;border:1px solid #d9e0ea;border-radius:99px;padding:4px 9px;color:#44506a}.stem{font-size:18px;line-height:1.7;margin:18px 0}.material{border:1px solid #d9e0ea;background:#f8fafc;border-radius:12px;padding:14px;margin-bottom:18px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #cfd7e3;padding:8px;text-align:center}th{background:#f2f5f9}.figure{display:flex;justify-content:center;border:1px dashed #cdd5df;border-radius:12px;padding:14px;margin-bottom:18px;background:#fff}.options{display:grid;gap:11px}.option{border:1px solid #d9e0ea;background:#fff;border-radius:12px;padding:13px 15px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;font-size:16px}.option.selected{border-color:#3157d5;background:#f7f9ff;box-shadow:0 0 0 2px rgba(49,87,213,.12)}.letter{width:28px;height:28px;border:1px solid #b9c4d5;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto}.selected .letter{background:#3157d5;color:#fff;border-color:#3157d5}.option canvas{width:140px;height:86px;border:1px solid #edf0f4}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.hint{font-size:13px;color:#667085}.primary,.secondary{border-radius:10px;padding:10px 17px;font-size:14px;cursor:pointer}.primary{border:0;background:#3157d5;color:#fff}.primary:disabled{opacity:.45}.secondary{border:1px solid #d9e0ea;background:#fff}.result{display:none}.score{font-size:46px;font-weight:800;color:#3157d5}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.metric{border:1px solid #d9e0ea;border-radius:12px;padding:14px}.metric strong{display:block;font-size:22px;margin-top:4px}.detail{border-top:1px solid #e5e9f0;padding:10px 0;font-size:14px}.pass{color:#16794b}.fail{color:#b42318}@media(max-width:640px){.top{flex-direction:column;align-items:flex-start}.progress{width:100%;min-width:0}.card{padding:20px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div><h1>Page Agent 综合推理离线基准</h1><p>8 道合成题，仅用于授权 QA；不对应任何真实考试题库</p></div><div class="progress"><span id="progressText"></span><div class="bar"><div id="progressBar"></div></div></div></div>
  <main class="card" id="quizCard">
    <div class="meta"><strong id="qnum"></strong><span class="badge" id="category"></span><span class="badge" id="mode"></span></div>
    <div id="questionArea"></div><div class="options" id="options"></div>
    <div class="actions"><span class="hint">请选择一个选项</span><button id="nextBtn" class="primary" disabled>下一题</button></div>
  </main>
  <section class="card result" id="resultCard"><span class="badge">Benchmark Complete</span><h2>测试完成</h2><div class="score" id="score"></div><p id="summary"></p><div class="metrics" id="metrics"></div><div id="details"></div><div class="actions"><span class="hint">比较 DOM 与 Canvas 两类结果</span><button id="restartBtn" class="secondary">重新开始</button></div></section>
</div>
<script>
(()=>{
const qs=[
{c:'言语理解',m:'DOM 文本',s:'某城市更新项目没有一味增加设施数量，而是先观察居民在不同时间段如何使用街角、树荫和通道，再根据实际行为调整座椅、照明和慢行空间。项目完成后，新增设施并不多，但停留时间和步行比例明显提高。<br><br>这段文字主要说明：',o:['城市更新的首要目标是增加公共设施数量','公共空间设计应以真实使用行为为依据','提高步行比例主要依赖增加照明设施','居民停留时间越长，城市更新成本越低'],a:1},
{c:'数量关系',m:'DOM 文本',s:'某商品先在原价基础上涨价 20%，随后按上涨后的价格打八折。最终价格与原价相比：',o:['上涨 4%','不变','下降 4%','下降 20%'],a:2},
{c:'逻辑判断',m:'DOM 文本',s:'已知：①所有甲类人员都是乙类人员；②没有乙类人员属于丙类人员；③有些丁类人员属于甲类人员。由此一定可以推出：',o:['所有丁类人员都不属于丙类人员','有些乙类人员属于丙类人员','有些丁类人员不属于丙类人员','所有乙类人员都是甲类人员'],a:2},
{c:'资料分析',m:'DOM 表格',s:'根据下表，哪个部门的受理率（受理数 ÷ 申请数）最高？',mat:'<table><thead><tr><th>部门</th><th>申请数</th><th>受理数</th></tr></thead><tbody><tr><td>甲</td><td>120</td><td>96</td></tr><tr><td>乙</td><td>150</td><td>105</td></tr><tr><td>丙</td><td>80</td><td>68</td></tr><tr><td>丁</td><td>200</td><td>150</td></tr></tbody></table>',o:['甲部门','乙部门','丙部门','丁部门'],a:2},
{c:'符号规律',m:'DOM 符号',s:'观察序列：<strong>○●○ → ●○● → ○●○ → ？</strong><br>请选择最符合规律的一项。',o:['○○○','●○●','●●○','○○●'],a:1},
{c:'图形序列',m:'Canvas 纯视觉',s:'观察下列图形序列，选择最符合旋转规律的一项。',v:'rot',o:['A','B','C','D'],a:3},
{c:'图形矩阵',m:'Canvas 纯视觉',s:'根据 3×3 图形矩阵的数量规律，选择右下角缺失图形。',v:'dots',o:['A','B','C','D'],a:1},
{c:'图形分类',m:'Canvas 纯视觉',s:'下面四个图形中，哪一个与其他三个的结构规律不同？',v:'odd',o:['A','B','C','D'],a:3}
];
let i=0,sel=Array(qs.length).fill(null);const $=s=>document.querySelector(s),qa=$('#questionArea'),ops=$('#options'),next=$('#nextBtn');
function setup(c,w,h){const d=Math.max(1,devicePixelRatio||1);c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px';const x=c.getContext('2d');x.scale(d,d);return x}
function arrow(x,cx,cy,r){x.save();x.translate(cx,cy);x.rotate(r*Math.PI/2);x.strokeStyle='#111827';x.fillStyle='#111827';x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(-28,28);x.lineTo(-28,-24);x.lineTo(22,-24);x.stroke();x.beginPath();x.moveTo(22,-24);x.lineTo(8,-34);x.lineTo(8,-14);x.closePath();x.fill();x.restore()}
function dotCell(x,px,py,n){x.strokeStyle='#98a2b3';x.strokeRect(px,py,70,70);const p=[[18,18],[52,18],[18,52],[52,52],[35,35],[35,18]];x.fillStyle='#111827';for(let k=0;k<n;k++){x.beginPath();x.arc(px+p[k][0],py+p[k][1],7,0,Math.PI*2);x.fill()}}
function grid(x,px,py,p){const s=28;x.strokeStyle='#475467';x.lineWidth=2;x.strokeRect(px,py,s*2,s*2);x.beginPath();x.moveTo(px+s,py);x.lineTo(px+s,py+s*2);x.moveTo(px,py+s);x.lineTo(px+s*2,py+s);x.stroke();x.fillStyle='#111827';p.forEach(([r,c])=>x.fillRect(px+c*s+3,py+r*s+3,s-6,s-6))}
function stemCanvas(v,c){if(v==='rot'){const x=setup(c,540,140);[0,1,2].forEach((r,k)=>arrow(x,70+k*150,70,r));x.fillStyle='#667085';x.font='28px system-ui';x.fillText('?',475,80)}if(v==='dots'){const x=setup(c,390,280),vals=[[1,2,3],[2,3,4],[3,4,null]];for(let r=0;r<3;r++)for(let k=0;k<3;k++){const px=50+k*95,py=18+r*84;if(vals[r][k]==null){x.strokeStyle='#98a2b3';x.strokeRect(px,py,70,70);x.fillStyle='#667085';x.font='28px system-ui';x.fillText('?',px+25,py+43)}else dotCell(x,px,py,vals[r][k])}}if(v==='odd'){const x=setup(c,520,145),ps=[[[0,0],[1,1]],[[0,1],[1,0]],[[0,0],[1,1]],[[0,0],[0,1]]];ps.forEach((p,k)=>{grid(x,38+k*120,36,p);x.fillStyle='#667085';x.font='15px system-ui';x.fillText(String.fromCharCode(65+k),58+k*120,116)})}}
function optionCanvas(v,c,k){const x=setup(c,140,86);if(v==='rot')arrow(x,70,43,[0,1,2,3][k]);if(v==='dots')dotCell(x,35,8,[4,5,6,3][k]);if(v==='odd'){const ps=[[[0,0],[1,1]],[[0,1],[1,0]],[[0,0],[1,1]],[[0,0],[0,1]]];grid(x,42,15,ps[k])}}
function render(){const q=qs[i];$('#qnum').textContent=`第 ${i+1} 题`;$('#category').textContent=q.c;$('#mode').textContent=q.m;$('#progressText').textContent=`第 ${i+1} / ${qs.length} 题`;$('#progressBar').style.width=((i+1)/qs.length*100)+'%';qa.innerHTML=`<div class="stem">${q.s}</div>`+(q.mat?`<div class="material">${q.mat}</div>`:'');if(q.v){const d=document.createElement('div');d.className='figure';const c=document.createElement('canvas');d.appendChild(c);qa.appendChild(d);stemCanvas(q.v,c)}ops.innerHTML='';q.o.forEach((t,k)=>{const b=document.createElement('button');b.type='button';b.className='option'+(sel[i]===k?' selected':'');b.dataset.option=String(k);b.innerHTML=`<span class="letter">${String.fromCharCode(65+k)}</span>`;if(q.v){const c=document.createElement('canvas');b.appendChild(c);requestAnimationFrame(()=>optionCanvas(q.v,c,k))}else{const s=document.createElement('span');s.textContent=t;b.appendChild(s)}b.onclick=()=>{sel[i]=k;[...ops.children].forEach(n=>n.classList.remove('selected'));b.classList.add('selected');next.disabled=false};ops.appendChild(b)});next.disabled=sel[i]==null;next.textContent=i===qs.length-1?'提交并查看结果':'下一题';history.replaceState({q:i+1},'',`?q=${i+1}`)}
function finish(){const ok=qs.map((q,k)=>sel[k]===q.a),score=ok.filter(Boolean).length;$('#quizCard').style.display='none';$('#resultCard').style.display='block';$('#score').textContent=`${score} / ${qs.length}`;$('#summary').textContent=`正确率 ${Math.round(score/qs.length*100)}%。请重点比较 DOM 与 Canvas 题。`;const dom=qs.map((q,k)=>q.m.startsWith('DOM')?k:null).filter(k=>k!==null),vis=qs.map((q,k)=>q.m==='Canvas 纯视觉'?k:null).filter(k=>k!==null);$('#metrics').innerHTML=`<div class="metric">DOM 文本/表格<strong>${dom.filter(k=>ok[k]).length} / ${dom.length}</strong></div><div class="metric">Canvas 纯视觉<strong>${vis.filter(k=>ok[k]).length} / ${vis.length}</strong></div>`;$('#details').innerHTML='<h3>逐题结果</h3>'+qs.map((q,k)=>`<div class="detail"><span class="${ok[k]?'pass':'fail'}">${ok[k]?'PASS':'FAIL'}</span> · 第 ${k+1} 题 · ${q.c} · 选择 ${sel[k]==null?'未作答':String.fromCharCode(65+sel[k])} · 正确 ${String.fromCharCode(65+q.a)}</div>`).join('');history.replaceState({done:true},'', '?result=1')}
next.onclick=()=>{if(sel[i]==null)return;if(i===qs.length-1)return finish();i++;render()};$('#restartBtn').onclick=()=>{sel.fill(null);i=0;$('#resultCard').style.display='none';$('#quizCard').style.display='block';render()};render();
})();
</script>
</body>
</html>
